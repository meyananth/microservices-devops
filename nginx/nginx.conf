events {}

http {
  server {
    listen 80;

    location = /health {
      return 200 'nginx ok';
      add_header Content-Type text/plain;
    }

    location /users/health {
      proxy_pass http://user-service:3001/health;
    }
    location /users {
      proxy_pass http://user-service:3001;
    }

    location /products/health {
      proxy_pass http://product-service:3002/health;
    }
    location /products {
      proxy_pass http://product-service:3002;
    }

    location /orders/health {
      proxy_pass http://order-service:3003/health;
    }
    location /orders {
      proxy_pass http://order-service:3003;
    }
  }
}
