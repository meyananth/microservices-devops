services:
  user-service:
    build: ./services/user-service
    image: user-service:${VERSION:-1.0.0}
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-service:
    build: ./services/product-service
    image: product-service:${VERSION:-1.0.0}
    environment:
      - PORT=3002
      - NODE_ENV=production
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  order-service:
    build: ./services/order-service
    image: order-service:${VERSION:-1.0.0}
    environment:
      - PORT=3003
      - NODE_ENV=production
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
