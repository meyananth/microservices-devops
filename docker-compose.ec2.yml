services:
  user-service:
    image: ${REGISTRY}/user-service:${TAG}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  product-service:
    image: ${REGISTRY}/product-service:${TAG}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    image: ${REGISTRY}/order-service:${TAG}
    restart: unless-stopped
    networks: [appnet]
    depends_on:
      user-service:    { condition: service_healthy }
      product-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [user-service, product-service, order-service]
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet:
